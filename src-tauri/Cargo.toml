[package]
name = "dark-control"
version = "0.4.1"
description = "Dark Control - desktop configurator for supported Dark Project keyboards"
authors = ["Dark Control contributors"]
edition = "2021"

[lib]
name = "dark_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2.6"
thiserror = "2"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
