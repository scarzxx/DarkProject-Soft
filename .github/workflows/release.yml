name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Validate release version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) { throw "Release tag must start with v." }
          $version = $tag.Substring(1)
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoText = Get-Content src-tauri/Cargo.toml -Raw
          $cargoMatch = [regex]::Match($cargoText, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $cargoMatch.Success) { throw "Could not read Cargo.toml version." }
          $cargoVersion = $cargoMatch.Groups[1].Value
          if ($version -ne $packageVersion -or $version -ne $tauriVersion -or $version -ne $cargoVersion) {
            throw "Tag $tag does not match package.json=$packageVersion, tauri.conf.json=$tauriVersion, Cargo.toml=$cargoVersion"
          }

      - name: Validate generated vendor metadata import
        run: npm run data:import

      - name: Build frontend
        run: npm run build

      - name: Test frontend and metadata routing
        run: npm test

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Validate updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Missing GitHub Actions secret TAURI_SIGNING_PRIVATE_KEY. Generate it with: npm run tauri signer generate -- -w ~/.tauri/dark-control.key"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PUBLIC_KEY)) {
            throw "Missing GitHub Actions secret TAURI_SIGNING_PUBLIC_KEY. Use the public key printed by the Tauri signer command."
          }

      - name: Configure signed updater build
        shell: pwsh
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          CUSTOM_UPDATER_ENDPOINT: ${{ vars.TAURI_UPDATER_ENDPOINT }}
        run: |
          $endpoint = $env:CUSTOM_UPDATER_ENDPOINT
          if ([string]::IsNullOrWhiteSpace($endpoint)) {
            $endpoint = "https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
          }
          $config = @{
            bundle = @{
              createUpdaterArtifacts = $true
            }
            plugins = @{
              updater = @{
                pubkey = $env:TAURI_SIGNING_PUBLIC_KEY
                endpoints = @($endpoint)
                windows = @{
                  installMode = "passive"
                }
              }
            }
          }
          $config | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.release.conf.json -Encoding utf8
          Write-Host "Updater endpoint: $endpoint"

      - name: Build signed release and publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Dark Control ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --config src-tauri/tauri.release.conf.json --bundles msi,nsis
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: Dark-Control-[platform]-[arch]-[bundle]
          retryAttempts: 2
