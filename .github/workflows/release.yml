name: release

on:
  push:
    branches:
      - main
    paths:
      - "package.json"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $current = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($current -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid package.json version: $current"
          }

          $previous = ""
          $before = "${{ github.event.before }}"
          if ($before -and $before -notmatch '^0+$') {
            try {
              $previousJson = git show "$before`:package.json" 2>$null | ConvertFrom-Json
              $previous = [string]$previousJson.version
            } catch {
              $previous = ""
            }
          }

          $changed = $current -ne $previous
          "version=$current" >> $env:GITHUB_OUTPUT
          "tag=v$current" >> $env:GITHUB_OUTPUT
          "changed=$($changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Previous version: $previous"
          Write-Host "Current version:  $current"
          Write-Host "Release required: $changed"

      - name: Stop when version did not change
        if: steps.version.outputs.changed != 'true'
        run: echo "package.json changed, but its version did not. No release will be created."

      - name: Ensure release tag does not already exist
        if: steps.version.outputs.changed == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Tag $tag already exists. Increase package.json version before publishing another release."
          }
          $global:LASTEXITCODE = 0

      - name: Setup Node.js
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        if: steps.version.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Synchronize application version
        if: steps.version.outputs.changed == 'true'
        run: node scripts/release-version.mjs

      - name: Install frontend dependencies
        if: steps.version.outputs.changed == 'true'
        run: npm install --no-audit --no-fund

      - name: Validate generated vendor metadata import
        if: steps.version.outputs.changed == 'true'
        run: npm run data:import

      - name: Build frontend
        if: steps.version.outputs.changed == 'true'
        run: npm run build

      - name: Test frontend and metadata routing
        if: steps.version.outputs.changed == 'true'
        run: npm test

      - name: Check Rust backend
        if: steps.version.outputs.changed == 'true'
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust backend
        if: steps.version.outputs.changed == 'true'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust backend
        if: steps.version.outputs.changed == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows setup EXE
        if: steps.version.outputs.changed == 'true'
        run: npm run tauri:build -- --bundles nsis

      - name: Prepare GitHub Release EXE
        if: steps.version.outputs.changed == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $nsis = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $nsis) { throw "NSIS setup EXE was not produced." }
          Copy-Item $nsis.FullName "release\Dark-Control-$tag-Windows-x64-setup.exe"

      - name: Create release tag
        if: steps.version.outputs.changed == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $tag $env:GITHUB_SHA -m "Dark Control $tag"
          git push origin $tag

      - name: Upload release workflow artifact
        if: steps.version.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Control-${{ steps.version.outputs.tag }}-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Dark Control ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: release/*.exe
