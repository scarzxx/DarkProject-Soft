name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Validate release version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) { throw "Release tag must start with v." }
          $version = $tag.Substring(1)
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoText = Get-Content src-tauri/Cargo.toml -Raw
          $cargoMatch = [regex]::Match($cargoText, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $cargoMatch.Success) { throw "Could not read Cargo.toml version." }
          $cargoVersion = $cargoMatch.Groups[1].Value
          if ($version -ne $packageVersion -or $version -ne $tauriVersion -or $version -ne $cargoVersion) {
            throw "Tag $tag does not match package.json=$packageVersion, tauri.conf.json=$tauriVersion, Cargo.toml=$cargoVersion"
          }

      - name: Validate generated vendor metadata import
        run: npm run data:import

      - name: Build frontend
        run: npm run build

      - name: Test frontend and metadata routing
        run: npm test

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows EXE + MSI + NSIS
        run: npm run tauri:build -- --bundles msi,nsis

      - name: Prepare GitHub Release files
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path release | Out-Null

          $portable = "src-tauri\target\release\dark-control.exe"
          $msi = Get-ChildItem "src-tauri\target\release\bundle\msi\*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          $nsis = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not (Test-Path $portable)) { throw "Portable EXE was not produced: $portable" }
          if ($null -eq $msi) { throw "MSI installer was not produced." }
          if ($null -eq $nsis) { throw "NSIS installer was not produced." }

          Copy-Item $portable "release\Dark-Control-$tag-Windows-x64.exe"
          Copy-Item $msi.FullName "release\Dark-Control-$tag-Windows-x64.msi"
          Copy-Item $nsis.FullName "release\Dark-Control-$tag-Windows-x64-setup.exe"

          Get-ChildItem release -File |
            Where-Object { $_.Extension -in ".exe", ".msi" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash *$($_.Name)"
            } | Set-Content "release\SHA256SUMS.txt" -Encoding ascii

      - name: Upload release workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Control-${{ github.ref_name }}-Windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Dark Control ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.msi
            release/SHA256SUMS.txt
