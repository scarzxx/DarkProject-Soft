name: release

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "CHANGELOG.md"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $current = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($current -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid package.json version: $current"
          }

          $tag = "v$current"
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          $tagExists = -not [string]::IsNullOrWhiteSpace(($existing -join "`n"))
          $releaseRequired = -not $tagExists

          "version=$current" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release_required=$($releaseRequired.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Current version:  $current"
          Write-Host "Tag exists:       $tagExists"
          Write-Host "Release required: $releaseRequired"

      - name: Stop when this version is already released
        if: steps.version.outputs.release_required != 'true'
        run: echo "Tag ${{ steps.version.outputs.tag }} already exists. No release will be created."

      - name: Setup Node.js
        if: steps.version.outputs.release_required == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract release notes from CHANGELOG
        if: steps.version.outputs.release_required == 'true'
        run: node scripts/extract-release-notes.mjs "${{ steps.version.outputs.version }}" release-notes.md

      - name: Setup Rust
        if: steps.version.outputs.release_required == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Synchronize application version
        if: steps.version.outputs.release_required == 'true'
        run: node scripts/release-version.mjs

      - name: Install frontend dependencies
        if: steps.version.outputs.release_required == 'true'
        run: npm install --no-audit --no-fund

      - name: Validate generated vendor metadata import
        if: steps.version.outputs.release_required == 'true'
        run: npm run data:import

      - name: Build frontend
        if: steps.version.outputs.release_required == 'true'
        run: npm run build

      - name: Test frontend and metadata routing
        if: steps.version.outputs.release_required == 'true'
        run: npm test

      - name: Check Rust backend
        if: steps.version.outputs.release_required == 'true'
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust backend
        if: steps.version.outputs.release_required == 'true'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust backend
        if: steps.version.outputs.release_required == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows setup EXE
        if: steps.version.outputs.release_required == 'true'
        run: npm run tauri:build -- --bundles nsis

      - name: Prepare GitHub Release EXE
        if: steps.version.outputs.release_required == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $nsis = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $nsis) { throw "NSIS setup EXE was not produced." }
          Copy-Item $nsis.FullName "release\Dark-Control-$tag-Windows-x64-setup.exe"

      - name: Create release tag
        if: steps.version.outputs.release_required == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $tag $env:GITHUB_SHA -m "Dark Control $tag"
          git push origin $tag

      - name: Upload release workflow artifact
        if: steps.version.outputs.release_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Control-${{ steps.version.outputs.tag }}-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: steps.version.outputs.release_required == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Dark Control ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: release/*.exe
