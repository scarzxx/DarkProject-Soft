name: build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Validate generated vendor metadata import
        run: npm run data:import

      - name: Build frontend
        run: npm run build

      - name: Test translations, registry, layouts and command routing
        run: npm test

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test seven protocol codecs, golden vectors, transport failures and Bushido compatibility
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows EXE + MSI + NSIS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run tauri:build -- --bundles msi,nsis

      - name: Verify Windows build outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $required = @(
            "src-tauri\target\release\dark-control.exe"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing build output: $file" }
          }
          if (-not (Get-ChildItem "src-tauri\target\release\bundle\msi\*.msi" -ErrorAction SilentlyContinue)) {
            throw "MSI installer was not produced."
          }
          if (-not (Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue)) {
            throw "NSIS installer was not produced."
          }

      - name: Upload Windows build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Control-Windows-x64
          path: |
            src-tauri/target/release/dark-control.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
